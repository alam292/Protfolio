<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#020509"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#flowBg)"/>

  <!-- Top Pipeline Header -->
  <rect x="0" y="0" width="800" height="56" fill="#0c121e"/>
  <line x1="0" y1="56" x2="800" y2="56" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="28" cy="28" r="7" fill="#ff5722"/>
  <text x="46" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">DevFlow Orchestrator</text>
  <rect x="220" y="16" width="120" height="24" rx="12" fill="#22c55e" fill-opacity="0.15"/>
  <text x="236" y="32" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">PIPELINE #842: SUCCESS</text>

  <!-- DAG Flow Canvas (Visual Stages) -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="720" height="150" rx="10" fill="#0f1624" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="24" y="28" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">DIRECTED ACYCLIC GRAPH (DAG) PIPELINE WORKFLOW</text>

    <!-- Connecting Lines -->
    <line x1="130" y1="85" x2="190" y2="85" stroke="#22c55e" stroke-width="2"/>
    <line x1="290" y1="85" x2="350" y2="85" stroke="#22c55e" stroke-width="2"/>
    <line x1="450" y1="85" x2="510" y2="85" stroke="#ff5722" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Stage 1: Checkout & Lint -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#141e30" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="5" fill="#22c55e"/>
      <text x="32" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Lint &amp; Audit</text>
      <text x="20" y="46" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">14s · Passed</text>
    </g>

    <!-- Stage 2: Unit & Integration Test -->
    <g transform="translate(190, 55)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#141e30" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="5" fill="#22c55e"/>
      <text x="32" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Vitest Suites</text>
      <text x="20" y="46" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">38s · 142 passed</text>
    </g>

    <!-- Stage 3: Docker Build -->
    <g transform="translate(350, 55)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#141e30" stroke="#22c55e" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="5" fill="#22c55e"/>
      <text x="32" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Docker Image</text>
      <text x="20" y="46" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">45s · Layer Cached</text>
    </g>

    <!-- Stage 4: Kubernetes Rollout -->
    <g transform="translate(510, 55)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#1a1c29" stroke="#ff5722" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="5" fill="#ff5722"/>
      <text x="32" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Canary Deploy</text>
      <text x="20" y="46" fill="#ff8a50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">10% Traffic Live</text>
    </g>
  </g>

  <!-- Live Terminal Logs Split -->
  <g transform="translate(40, 245)">
    <rect x="0" y="0" width="460" height="230" rx="10" fill="#080c14" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="0" y="0" width="460" height="30" rx="10 10 0 0" fill="#101826"/>
    <text x="16" y="20" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">STDOUT / ANSI EXECUTION STREAM</text>

    <g font-family="Courier, monospace" font-size="10.5" fill="#9ca3af">
      <text x="16" y="55"><tspan fill="#6b7280">03:18:22</tspan> <tspan fill="#22c55e">[INFO]</tspan> Pulling base image node:20-alpine...</text>
      <text x="16" y="75"><tspan fill="#6b7280">03:18:24</tspan> <tspan fill="#22c55e">[INFO]</tspan> Cached layers found (sha256:8f2a...)</text>
      <text x="16" y="95"><tspan fill="#6b7280">03:18:28</tspan> <tspan fill="#22c55e">[RUN]</tspan> pnpm run test:ci --coverage</text>
      <text x="16" y="115"><tspan fill="#6b7280">03:18:32</tspan> <tspan fill="#00d2ff">[PASS]</tspan> 42 unit test suites passed (100% coverage)</text>
      <text x="16" y="135"><tspan fill="#6b7280">03:18:39</tspan> <tspan fill="#ff8a50">[DOCKER]</tspan> Exporting multi-platform image manifest</text>
      <text x="16" y="155"><tspan fill="#6b7280">03:18:42</tspan> <tspan fill="#22c55e">[ROLLOUT]</tspan> Zero-downtime rolling update initiated</text>
      <text x="16" y="175"><tspan fill="#6b7280">03:18:45</tspan> <tspan fill="#22c55e">[SUCCESS]</tspan> Healthchecks 200 OK across all pods</text>
      <text x="16" y="195"><tspan fill="#6b7280">03:18:47</tspan> <tspan fill="#ff5722">[DEPLOYED]</tspan> Live on production cluster (v3.1.2)</text>
    </g>
  </g>

  <!-- Side Metrics -->
  <g transform="translate(520, 245)">
    <rect x="0" y="0" width="240" height="230" rx="10" fill="#0f1624" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="18" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">OPTIMIZATION STATS</text>

    <g transform="translate(18, 48)">
      <text x="0" y="12" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Build Time Reduction</text>
      <text x="0" y="32" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">-65% <tspan font-size="10" fill="#9ca3af">(9m to 3m12s)</tspan></text>
    </g>

    <g transform="translate(18, 105)">
      <text x="0" y="12" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Docker Layer Cache Rate</text>
      <text x="0" y="32" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">94.8% HIT</text>
    </g>

    <g transform="translate(18, 162)">
      <text x="0" y="12" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Container Cold Start</text>
      <text x="0" y="32" fill="#ff8a50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">&lt; 350 ms</text>
    </g>
  </g>
</svg>

