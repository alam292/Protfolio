<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <linearGradient id="nexusAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nexusBg)"/>

  <!-- Subtle Top Banner / Toolbar -->
  <rect x="0" y="0" width="800" height="52" fill="#0c1017" stroke-bottom="#ffffff" stroke-width="1"/>
  <line x1="0" y1="52" x2="800" y2="52" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="28" cy="26" r="8" fill="#ff5722"/>
  <text x="46" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">NexusUI Studio</text>
  <text x="160" y="31" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">v2.4.0 · Design Tokens &amp; Motion</text>

  <!-- Left Sidebar: Component Catalog -->
  <rect x="0" y="52" width="200" height="448" fill="#080b10" opacity="0.95"/>
  <line x1="200" y1="52" x2="200" y2="500" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="24" y="84" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">FOUNDATIONS</text>
  
  <rect x="16" y="98" width="168" height="28" rx="6" fill="#141a24"/>
  <text x="32" y="116" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Color Tokens</text>
  <text x="32" y="146" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Typography Matrix</text>
  <text x="32" y="174" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Elevation &amp; Glass</text>

  <text x="24" y="210" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">COMPONENTS (48)</text>
  <rect x="16" y="222" width="168" height="30" rx="6" fill="#ff5722" fill-opacity="0.15" stroke="#ff5722" stroke-width="1"/>
  <text x="32" y="242" fill="#ff8a50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Button Interactive</text>
  <text x="32" y="274" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Glass Card Container</text>
  <text x="32" y="304" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Modal &amp; Drawer</text>
  <text x="32" y="334" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Data Table Grid</text>
  <text x="32" y="364" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Kinetic Hover Triggers</text>

  <!-- Main Canvas: Live Playground -->
  <g transform="translate(225, 75)">
    <!-- Canvas Frame -->
    <rect x="0" y="0" width="550" height="260" rx="12" fill="#0f141e" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Component Stage: Button Variants &amp; Micro-Interactions</text>
    <text x="24" y="52" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Rendered with 60fps hardware-accelerated GSAP transforms</text>

    <!-- Component Previews -->
    <g transform="translate(24, 75)">
      <!-- Primary Orange Glow Button -->
      <rect x="0" y="0" width="150" height="44" rx="22" fill="url(#nexusAccent)"/>
      <text x="36" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Primary Touch</text>

      <!-- Glass Secondary Button -->
      <rect x="170" y="0" width="150" height="44" rx="22" fill="#151b26" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="204" y="27" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Glass Outline</text>

      <!-- Neon Accent Button -->
      <rect x="340" y="0" width="150" height="44" rx="22" fill="#121822" stroke="#ff5722" stroke-width="1.5"/>
      <text x="382" y="27" fill="#ff8a50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Active State</text>
    </g>

    <!-- Interactive Sliders / Controls in Canvas -->
    <g transform="translate(24, 145)">
      <rect x="0" y="0" width="490" height="90" rx="8" fill="#090d14" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="20" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Border Radius: 22px</text>
      <rect x="20" y="36" width="200" height="6" rx="3" fill="#1f2937"/>
      <rect x="20" y="36" width="140" height="6" rx="3" fill="#ff5722"/>
      <circle cx="160" cy="39" r="6" fill="#ffffff"/>

      <text x="260" y="26" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Glass Blur: 16px</text>
      <rect x="260" y="36" width="200" height="6" rx="3" fill="#1f2937"/>
      <rect x="260" y="36" width="110" height="6" rx="3" fill="#ff5722"/>
      <circle cx="370" cy="39" r="6" fill="#ffffff"/>

      <text x="20" y="70" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">✓ 100% WCAG 2.1 AA Contrast Compliant (7.8:1 Ratio)</text>
    </g>
  </g>

  <!-- Bottom Code & Token Inspector -->
  <g transform="translate(225, 350)">
    <rect x="0" y="0" width="550" height="135" rx="10" fill="#090c12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="24" fill="#6b7280" font-family="Courier, monospace" font-size="11">// Generated Design Token (Tailwind &amp; CSS Variables)</text>
    <text x="20" y="46" fill="#ff8a50" font-family="Courier, monospace" font-size="12">export const <tspan fill="#ffffff">nexusButton</tspan> = {</text>
    <text x="40" y="66" fill="#9ca3af" font-family="Courier, monospace" font-size="12">background: <tspan fill="#22c55e">"linear-gradient(135deg, #ff5722, #ff7a00)"</tspan>,</text>
    <text x="40" y="86" fill="#9ca3af" font-family="Courier, monospace" font-size="12">backdropBlur: <tspan fill="#00d2ff">"16px"</tspan>, transition: <tspan fill="#22c55e">"transform 0.25s cubic-bezier(0.16,1,0.3,1)"</tspan></text>
    <text x="20" y="108" fill="#ff8a50" font-family="Courier, monospace" font-size="12">};</text>
  </g>
</svg>

