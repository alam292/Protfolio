<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folioblox CMS — Split-Screen Live Form Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=2.2">
  <link rel="stylesheet" href="css/auth-modal.css?v=2.0">
  <style>
    :root {
      --editor-bg: #0b0f19;
      --editor-panel-bg: rgba(17, 24, 39, 0.85);
      --editor-border: rgba(255, 255, 255, 0.08);
      --editor-cyan: #00f0ff;
      --editor-accent: #3b82f6;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--editor-bg);
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Top Navigation */
    .dashboard-header {
      height: 60px;
      background: rgba(11, 15, 25, 0.95);
      border-bottom: 1px solid var(--editor-border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }
    .dashboard-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }
    .logo-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--editor-cyan);
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .dashboard-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dirty-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .dirty-badge.active {
      display: inline-flex;
    }
    .btn-save-publish {
      background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
      color: #0b0f19;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-save-publish:hover {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transform: translateY(-1px);
    }
    .btn-outline-back {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--editor-border);
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-outline-back:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    /* Main Split Screen Container */
    .split-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    /* Left Form Editor */
    .editor-pane {
      width: 480px;
      background: var(--editor-panel-bg);
      border-right: 1px solid var(--editor-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-tabs {
      display: flex;
      border-bottom: 1px solid var(--editor-border);
      background: rgba(11, 15, 25, 0.5);
    }
    .editor-tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .editor-tab-btn.active {
      color: var(--editor-cyan);
      border-bottom-color: var(--editor-cyan);
      background: rgba(0, 240, 255, 0.04);
    }
    .editor-form-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .editor-field-group {
      margin-bottom: 18px;
    }
    .editor-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .editor-input, .editor-textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--editor-border);
      color: #ffffff;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .editor-input:focus, .editor-textarea:focus {
      border-color: var(--editor-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }
    .editor-textarea {
      resize: vertical;
      min-height: 80px;
    }
    /* Right Live Preview */
    .preview-pane {
      flex: 1;
      background: #030608;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .preview-toolbar {
      height: 42px;
      background: rgba(11, 15, 25, 0.8);
      border-bottom: 1px solid var(--editor-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .preview-url {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preview-viewport-controls {
      display: flex;
      gap: 6px;
    }
    .viewport-btn {
      background: none;
      border: 1px solid var(--editor-border);
      color: #94a3b8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .viewport-btn.active {
      background: rgba(0, 240, 255, 0.1);
      color: var(--editor-cyan);
      border-color: rgba(0, 240, 255, 0.3);
    }
    .preview-frame-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }
    .preview-iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--editor-border);
      border-radius: 12px;
      background: #030608;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="dashboard-header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="/" class="dashboard-logo">
        <span>FOLIOBLOX</span>
        <span class="logo-badge">Split-Screen CMS</span>
      </a>
      <span class="dirty-badge" id="dirtyBadge">● Unsaved Changes</span>
    </div>

    <div class="dashboard-actions">
      <div id="dashboardUserBadge" style="display: flex; align-items: center; gap: 8px;"></div>
      <button type="button" class="btn-save-publish" id="btnPublishLive">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Publish Live</span>
      </button>
      <a href="/" class="btn-outline-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>View Live Site</span>
      </a>
    </div>
  </header>

  <!-- Split Screen Editor Body -->
  <div class="split-container">
    <!-- Left Pane: Form Fields -->
    <div class="editor-pane">
      <div class="editor-tabs">
        <button type="button" class="editor-tab-btn active" data-tab="tabProfile">Profile</button>
        <button type="button" class="editor-tab-btn" data-tab="tabSkills">Skills</button>
        <button type="button" class="editor-tab-btn" data-tab="tabProjects">Projects</button>
      </div>

      <div class="editor-form-scroll">
        <!-- PROFILE TAB -->
        <div id="tabProfile" class="editor-tab-content">
          <div class="editor-field-group">
            <label class="editor-label">Full Name</label>
            <input type="text" class="editor-input" id="fieldProfileName" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">Job Title / Specialty</label>
            <input type="text" class="editor-input" id="fieldProfileTitle" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">Short Tagline</label>
            <input type="text" class="editor-input" id="fieldProfileSubtitle" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">Bio / About Me</label>
            <textarea class="editor-textarea" id="fieldProfileBio" rows="4"></textarea>
          </div>
          <div class="editor-field-group">
            <label class="editor-label">Location</label>
            <input type="text" class="editor-input" id="fieldProfileLocation" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">Contact Email</label>
            <input type="email" class="editor-input" id="fieldProfileEmail" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">GitHub URL</label>
            <input type="url" class="editor-input" id="fieldSocialGithub" />
          </div>
          <div class="editor-field-group">
            <label class="editor-label">LinkedIn URL</label>
            <input type="url" class="editor-input" id="fieldSocialLinkedin" />
          </div>
        </div>

        <!-- SKILLS TAB -->
        <div id="tabSkills" class="editor-tab-content" style="display: none;">
          <div class="editor-field-group">
            <label class="editor-label">Skills (Comma-separated)</label>
            <textarea class="editor-textarea" id="fieldSkillsRaw" rows="8" placeholder="Python, FastAPI, React, Next.js, Node.js, PostgreSQL, Docker..."></textarea>
          </div>
        </div>

        <!-- PROJECTS TAB -->
        <div id="tabProjects" class="editor-tab-content" style="display: none;">
          <div class="editor-field-group">
            <label class="editor-label">Projects JSON Overview</label>
            <textarea class="editor-textarea" id="fieldProjectsJson" rows="12" style="font-family: 'JetBrains Mono', monospace; font-size: 11px;"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Pane: 1:1 Live Preview -->
    <div class="preview-pane">
      <div class="preview-toolbar">
        <div class="preview-url">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span>Live 1:1 Synced Preview</span>
        </div>
        <div class="preview-viewport-controls">
          <button type="button" class="viewport-btn active" data-width="100%">Desktop</button>
          <button type="button" class="viewport-btn" data-width="768px">Tablet</button>
          <button type="button" class="viewport-btn" data-width="390px">Mobile</button>
        </div>
      </div>

      <div class="preview-frame-wrap">
        <iframe id="previewIframe" class="preview-iframe" src="/"></iframe>
      </div>
    </div>
  </div>

  <script src="js/auth.js?v=1.0"></script>
  <script src="js/dashboard.js?v=1.0"></script>
</body>
</html>
